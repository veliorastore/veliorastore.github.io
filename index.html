<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELIORA | Premium Eyewear & Accessories</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #FAFAFA;
            --card-bg: #FFFFFF;
            --text-color: #111111;
            --text-muted: #666666;
            --brand-blue: #0F2027;
            --whatsapp-green: #075E54;
            --font-heading: 'Cormorant Garamond', serif;
            --font-body: 'Inter', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-body); background-color: var(--bg-color); color: var(--text-color); }
        a { text-decoration: none; color: inherit; }

        /* Duyuru Bandı */
        .announcement-bar {
            background-color: #111111;
            color: #ffffff;
            text-align: center;
            padding: 8px 15px;
            font-size: 0.75rem;
            letter-spacing: 2px;
            font-weight: 500;
            text-transform: uppercase;
        }

        /* Siyah Minimalist Header ve Yeni Logo Stili */
        .site-header {
            width: 100%;
            background-color: #000000;
            color: #ffffff;
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #ffffff;
            transition: opacity 0.3s ease;
        }

        .brand-logo:hover {
            opacity: 0.85;
        }

        .logo-mark {
            width: 30px;
            height: auto;
            margin-bottom: 6px;
            color: #ffffff;
        }

        .logo-text {
            font-family: 'Cormorant Garamond', 'Didot', serif;
            font-size: 1.6rem;
            font-weight: 400;
            letter-spacing: 0.45em;
            text-transform: uppercase;
            line-height: 1;
            margin-right: -0.45em;
        }

        .logo-subtext {
            font-family: 'Inter', sans-serif;
            font-size: 0.52rem;
            font-weight: 300;
            letter-spacing: 0.55em;
            color: #a1a1a1;
            text-transform: uppercase;
            margin-top: 6px;
            margin-right: -0.55em;
        }

        .menu-btn, .action-btn {
            background: none;
            border: none;
            color: #ffffff;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 5px;
        }

        .header-actions {
            display: flex;
            gap: 18px;
            align-items: center;
        }

        .sepet-btn {
            position: relative;
        }

        .cart-count {
            font-family: 'Inter', sans-serif;
            font-size: 0.6rem;
            position: absolute;
            top: -3px;
            right: -6px;
            background: #ffffff;
            color: #000000;
            border-radius: 50%;
            width: 15px;
            height: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        /* Vitrin & Ürünler */
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .section-title {
            font-family: var(--font-heading);
            font-size: 2.2rem;
            text-align: center;
            letter-spacing: 4px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 4px;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .img-wrapper {
            position: relative;
            width: 100%;
            padding-top: 125%; /* 4:5 Aspect Ratio */
            overflow: hidden;
            background: #f0f0f0;
        }

        .img-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info {
            padding: 18px 10px;
            text-align: center;
        }

        .product-title {
            font-family: var(--font-heading);
            font-size: 1.25rem;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .product-price {
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .logo-text { font-size: 1.3rem; }
            .logo-mark { width: 24px; }
            .product-grid { grid-template-columns: repeat(2, 1fr); gap: 15px; }
        }
    </style>
</head>
<body>

    <!-- Duyuru Bandı -->
    <div class="announcement-bar">
        TÜM SİPARİŞLERDE ÜCRETSİZ KARGO & KUTU HEDİYESİ
    </div>

    <!-- Siyah Minimalist Header & Yeni VELIORA Logosu -->
    <header class="site-header">
        <div class="header-container">
            <!-- Sol Menü Butonu -->
            <button class="menu-btn" aria-label="Menü">
                <i class="fa-solid fa-bars"></i>
            </button>

            <!-- ORTA: VELIORA LOGO ALANI -->
            <a href="#" class="brand-logo">
                <!-- V Monogram Simgesi -->
                <svg class="logo-mark" viewBox="0 0 100 90" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M 10,0 L 48,85 L 58,85 L 35,0 Z" fill="currentColor"/>
                    <path d="M 68,0 L 52,50 L 58,50 L 85,0 Z" fill="currentColor"/>
                </svg>
                <span class="logo-text">VELIORA</span>
                <span class="logo-subtext">ACCESSORIES</span>
            </a>

            <!-- Sağ İkonlar -->
            <div class="header-actions">
                <button class="action-btn" aria-label="Hesabım">
                    <i class="fa-regular fa-user"></i>
                </button>
                <button class="action-btn sepet-btn" aria-label="Sepet">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span class="cart-count">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Ana Koleksiyon Alanı -->
    <main class="container">
        <h2 class="section-title">Koleksiyon</h2>
        <div class="product-grid">
            <!-- Örnek Ürün Kartı 1 -->
            <div class="product-card">
                <div class="img-wrapper">
                    <img src="https://images.unsplash.com/photo-1511499767150-a48a237f0083?auto=format&fit=crop&q=80&w=800" alt="Gözlük Modeli 1">
                </div>
                <div class="product-info">
                    <h3 class="product-title">SIRIUS BLACK</h3>
                    <p class="product-price">1.450 TL</p>
                </div>
            </div>

            <!-- Örnek Ürün Kartı 2 -->
            <div class="product-card">
                <div class="img-wrapper">
                    <img src="https://images.unsplash.com/photo-1572635196237-14b3f281503f?auto=format&fit=crop&q=80&w=800" alt="Gözlük Modeli 2">
                </div>
                <div class="product-info">
                    <h3 class="product-title">VEGA GOLD</h3>
                    <p class="product-price">1.650 TL</p>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
